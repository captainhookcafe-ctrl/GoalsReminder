name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect signing tool
        run: |
          mkdir -p release-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" release-tools/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: GoalsReminder-release-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            release-tools/apksigner.jar
