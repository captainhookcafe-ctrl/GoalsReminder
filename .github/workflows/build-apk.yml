name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        run: |
          cat source.part1.b64 source.part2.b64 source.part3.b64 source.part4.b64 | base64 -d > project.zip
          unzip -q project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: GoalsReminder
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GoalsReminder-debug-apk
          path: GoalsReminder/app/build/outputs/apk/debug/app-debug.apk
